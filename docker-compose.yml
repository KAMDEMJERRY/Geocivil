services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: geocivil, POSTGRES_PASSWORD: geocivil, POSTGRES_DB: geocivil}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocivil"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
